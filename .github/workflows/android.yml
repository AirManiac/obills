name: Build Unsigned Android APK

on:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Next.js Web App
        run: |
          npm ci
          npm run build # Adjust this if your build script is named differently

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Unsigned Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: Upload Unsigned APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk